[project]
name = "viral-structure-engine"
version = "0.1.0"
description = "爆款结构迁移引擎 — 从爆款 Vlog 中学习结构，用日常素材创作新 Vlog"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "opencv-python>=4.9.0,<5.0.0",
    "numpy>=1.26.0,<2.3.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
asr = ["openai-whisper>=20240930"]
audio = ["librosa>=0.10.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
